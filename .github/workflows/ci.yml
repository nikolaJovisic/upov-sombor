name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: reproduction checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple \
                      -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

  full-reproduction:
    name: full pipeline (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
                      --extra-index-url https://pypi.org/simple \
                      -r requirements.txt

      - name: Every number in the paper
        run: |
          python analysis/final.py
          python analysis/robustness.py
          python analysis/imputation_effect.py
          python analysis/horizon_final.py

      - uses: actions/upload-artifact@v4
        with:
          name: numbers
          path: |
            analysis/*_numbers.json
            figures/
